<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TasteTest</title>
<meta name="description" content="Train your eye for design. Two hundred UI challenges: design in Figma against the clock, study comparable screens, redesign, and review what you kept, gained and still miss.">
<meta property="og:title" content="TasteTest">
<meta property="og:description" content="Train your eye for design. Two hundred UI challenges: design in Figma against the clock, study comparable screens, redesign, and review what you kept, gained and still miss.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000223">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column, max 1120px. The 60-minute routine drawn to scale is the recurring motif;
   on a round screen the stopwatch is the loudest thing, because the designing itself happens in Figma.
   Handed-in frames and search results are "paper": they keep a light palette on the navy ground, like screenshots. */
:root{
  /* Brand palette, used 60/25/10/5: navy ground, white type, pink for actions, cream for highlights. */
  --prussian-blue:#000223; --white:#ffffff; --deep-pink:#ff44b4; --banana-cream:#ffee71;
  --paper:var(--prussian-blue); --surface:#0a0d36; --sunk:#14174a; --ink:var(--white); --muted:#b5b7d1; --line:#2a2e63;
  --accent:var(--deep-pink); --accent-ink:var(--prussian-blue); --accent-soft:#2a0d3e;
  --mark:var(--banana-cream); --mark-ink:var(--prussian-blue); --scrim:rgb(0 0 12 / .78); --shadow:rgb(0 0 0 / .6);
  --shot-bg:#ffffff; --shot-ink:#1a1a21; --shot-muted:#6c6c7a; --shot-line:#e3e3ea; --shot-fill:#f2f2f6;
  --f-display:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --f-body:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ol,ul,figure{margin:0}
ol,ul{padding:0;list-style:none}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
kbd{font:500 12px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:1px 5px;background:var(--surface);color:var(--ink);white-space:nowrap}
img[data-gone]{visibility:hidden}

.app{max-width:1120px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px);padding-block:18px 72px;display:flex;flex-direction:column;gap:26px}
#view{display:flex;flex-direction:column;gap:clamp(26px,4vw,44px)}
#view>section{display:flex;flex-direction:column;gap:clamp(18px,2.6vw,28px)}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status{font-size:13px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0}
.vh:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-weight:600;font-size:14.5px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.quiet{background:transparent;color:var(--muted);padding-inline:8px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:no-preference){.btn,.tick,.chip,.seg button,.steps button{transition:background-color .15s,color .15s,border-color .15s}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;min-height:44px}
.mark{font:600 19px/1 var(--f-display);letter-spacing:-.02em;background:none;border:0;padding:8px 0;cursor:pointer;display:inline-flex;align-items:baseline;gap:3px}
.mark i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.steps{display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;max-width:100%}
.steps button{border:0;background:none;border-radius:999px;padding:7px 13px;font-size:13px;display:flex;gap:7px;align-items:baseline;cursor:pointer;color:var(--muted)}
.steps button span{font:500 11px var(--f-mono)}
.steps button b{font-weight:500}
.steps button[aria-current="step"]{background:var(--ink);color:var(--paper)}
.steps button:disabled{opacity:.42;cursor:default}
.streak{font:500 12px var(--f-mono);color:var(--muted)}
@media (max-width:560px){.steps button:not([aria-current]) b{display:none}}

/* home */
.hero{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(22px,4vw,52px)!important;align-items:end;padding-top:clamp(8px,3vw,36px)}
.hero h1{font-size:clamp(42px,7.4vw,88px);letter-spacing:-.04em;line-height:.94;margin-block:16px 20px}
.hero h1 mark{background:var(--mark);color:var(--mark-ink);padding-inline:.08em;border-radius:.06em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lead{font-size:17px;max-width:46ch;color:var(--muted)}
.today{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,2.4vw,26px);display:flex;flex-direction:column;gap:12px}
.today h2{font-size:clamp(22px,2.5vw,29px)}
.today>p{color:var(--muted)}
.meta{font:500 12px var(--f-mono);color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
@media (max-width:840px){.hero{grid-template-columns:minmax(0,1fr)}}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.sec-h h2{font-size:24px}
.sec-h h3{font-size:21px}
.sec-h p{font:500 12px var(--f-mono);color:var(--muted)}
.track{gap:10px!important}
.ruler{position:relative;height:16px;font:500 11px/1 var(--f-mono);color:var(--muted)}
.ruler span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ruler span:first-child{transform:none}
.ruler span:last-child{transform:translateX(-100%)}
.track ol{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.track li{flex-basis:0;flex-shrink:1;min-width:0;padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line)}
.track li:first-child{border-left:0}
.track li b{font:600 20px/1.1 var(--f-display);letter-spacing:-.02em}
.track li p{font-size:13.5px;color:var(--muted)}
.track .k{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.at{align-self:flex-start;margin-top:auto;font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted)}
.at.on{background:var(--mark);color:var(--mark-ink);border-color:transparent}
.track>p{font-size:13.5px;color:var(--muted);max-width:80ch}
@media (max-width:720px){.ruler{display:none}.track ol{flex-direction:column}.track li{border-left:0;border-top:1px solid var(--line)}.track li:first-child{border-top:0}}

/* lists: library and log */
.rows li{border-top:1px solid var(--line)}
.rows li:last-child{border-bottom:1px solid var(--line)}
.rows button{width:100%;display:grid;gap:2px 16px;align-items:baseline;padding:13px 4px;background:none;border:0;text-align:left;cursor:pointer}
.rows time,.rows .k,.rows .st{font:500 12px var(--f-mono);color:var(--muted)}
.rows b{font-weight:600;overflow-wrap:anywhere}
.rows em{font-style:normal;color:var(--muted);overflow-wrap:anywhere}
.lib,.log,.prog{gap:14px!important}
.lib-f{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:100%}
.seg button{border:0;background:none;border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted);display:flex;gap:7px;align-items:baseline}
.seg button span{font:500 11px var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lib-q{flex:1 1 220px;max-width:340px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px}
.lib-q::placeholder,.find-bar input::placeholder{color:var(--muted);opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.lib-l button{grid-template-columns:104px minmax(0,1.25fr) minmax(0,1.5fr) 84px}
.lib-l .st{text-align:right}
.lib-l .st.done{color:var(--ink)}
@media (max-width:720px){.lib-l button{grid-template-columns:minmax(0,1fr) auto}.lib-l b,.lib-l em{grid-column:1/-1}.lib-l .st{grid-row:1;grid-column:2}}
.log-l button{grid-template-columns:72px minmax(0,1.3fr) 150px minmax(0,1.5fr)}
@media (max-width:720px){.log-l button{grid-template-columns:64px minmax(0,1fr)}.log-l .st,.log-l em{grid-column:2}}
.log-empty{border:1px dashed var(--line);border-radius:16px;padding:20px 22px;color:var(--muted)}

/* progress: cream is what was there from the first version, pink what the redesign added */
.prog-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.prog-g{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:18px}
.card>p{font-size:13px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i,.trio h3 i{width:10px;height:10px;border-radius:3px;flex:none}
.sw-a{background:var(--mark)}
.sw-b{background:var(--accent)}
.sw-c{box-shadow:inset 0 0 0 1.5px var(--muted)}
.plot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;margin-top:auto}
.plot-y{display:flex;flex-direction:column;justify-content:space-between;font:500 11px/1 var(--f-mono);color:var(--muted);text-align:right;height:112px}
.cols{display:flex;align-items:flex-end;gap:6px;height:112px;border-block:1px solid var(--line);position:relative}
.col{flex:0 1 22px;min-width:5px;height:100%;display:flex;flex-direction:column-reverse;gap:2px;padding:0;border:0;background:none;cursor:pointer}
.col i{display:block;flex:none;min-height:3px}
.col i.a{background:var(--mark)}
.col i.b{background:var(--accent)}
.col i.z{background:var(--line)}
.col i:last-of-type{border-radius:4px 4px 0 0}
.col:hover,.col:focus-visible{background:var(--sunk)}
/* the readout sits in one fixed spot above the plot, so it can never run off the card */
.tip{display:none;position:absolute;bottom:calc(100% + 8px);left:0;max-width:100%;z-index:2;text-align:left;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4;pointer-events:none}
.col:hover .tip,.col:focus-visible .tip{display:block}
.meters{display:flex;flex-direction:column;gap:11px}
.meter{display:grid;grid-template-columns:112px minmax(0,1fr) 86px;gap:10px;align-items:center;font-size:13px}
.meter .bar{display:flex;gap:2px;height:10px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%}
.meter .bar .a{background:var(--mark)}
.meter .bar .b{background:var(--accent)}
.meter>span:last-child{font:500 12px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
@media (max-width:480px){.meter{grid-template-columns:92px minmax(0,1fr) 74px}}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.trio{grid-template-columns:minmax(0,1fr)}}
.trio>div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.trio h3{font-size:18px;display:flex;align-items:center;gap:9px}
.trio h3 span{margin-left:auto;font:500 12px var(--f-mono);letter-spacing:0;color:var(--muted)}
.trio ul{display:flex;flex-direction:column;gap:10px;font-size:14px;overflow-wrap:anywhere}
.trio li small{display:block;color:var(--muted);font-size:12.5px}
.trio .none{color:var(--muted);font-size:14px}

/* round */
.clock{display:flex;align-items:center;gap:14px clamp(14px,3vw,30px);flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.clock-t{font:500 clamp(54px,10.5vw,108px)/.88 var(--f-display);letter-spacing:-.03em;white-space:nowrap}
.clock-t span{display:inline-block;width:.57em;text-align:center}
.clock-t span.c{width:.26em}
.round[data-up="1"] .clock-t{color:var(--accent)}
.clock-n{display:flex;flex-direction:column;gap:8px;padding-left:clamp(14px,3vw,30px);border-left:1px solid var(--line)}
.clock-n h1{font-size:clamp(32px,6vw,64px);font-weight:500;letter-spacing:-.03em}
.clock-c{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.brief{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.brief h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.03em}
.brief h2{font-size:clamp(24px,3.3vw,36px)}
.brief h3{font-size:22px}
.brief p{color:var(--muted)}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
.next p{color:var(--muted);max-width:60ch}

/* design rounds: the work happens in Figma, this page explains and receives the frame */
.fig{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,var(--art-w,320px));gap:22px clamp(18px,4vw,48px);align-items:start;background:var(--sunk);border-radius:22px;padding:clamp(16px,2.8vw,28px)}
.fig:not([data-type="mobile"]){--art-w:500px}
@media (max-width:860px){.fig{grid-template-columns:minmax(0,1fr)}}
[data-drop="1"]{outline:2px dashed var(--accent);outline-offset:-6px}
.how{display:flex;flex-direction:column;gap:18px;min-width:0;max-width:56ch}
.how h3{font-size:clamp(22px,2.6vw,28px)}
.how ol{counter-reset:s;display:flex;flex-direction:column;gap:14px}
.how li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 12px}
.how li::before{content:counter(s,decimal-leading-zero);font:500 11px var(--f-mono);color:var(--muted);padding-top:4px}
.how li b{font-weight:600}
.how li p{grid-column:2;color:var(--muted);font-size:14px}
.how a{color:var(--ink)}
.hand{display:flex;flex-direction:column;gap:12px;min-width:0;max-width:var(--art-w,320px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.art{position:relative;background:var(--shot-bg);color:var(--shot-muted);border-radius:18px;overflow:auto;max-height:min(80vh,780px);box-shadow:0 18px 34px -24px var(--shadow)}
.art[data-empty="1"]{aspect-ratio:var(--ar);display:grid;place-items:center;text-align:center;padding:16px;font:500 12px/1.9 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.art kbd{background:var(--shot-fill);border-color:var(--shot-line);color:var(--shot-ink)}
.art img{display:block;width:100%;height:auto}

/* study: search results are paper */
.find{display:flex;flex-direction:column;gap:12px;min-width:0}
.find-bar{display:flex;gap:8px;flex-wrap:wrap}
.find-bar input{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 16px}
.paper{background:var(--shot-bg);color:var(--shot-ink);border-radius:18px;padding:clamp(10px,1.6vw,16px);min-height:96px;color-scheme:light;overflow:hidden}
.paper[data-off="1"]{background:none;color:var(--muted);border:1px dashed var(--line);color-scheme:dark;min-height:0}
.hits-msg{padding:10px 8px;font-size:14px;max-width:76ch}
/* Google's results element on the paper: full width, no second frame. Its result count, paging and branding stay untouched. */
#gcse .gsc-wrapper{max-width:none}
#gcse .gsc-control-cse{padding:0;border:0;background:transparent}
.hits{columns:5 150px;column-gap:12px}
.hit{break-inside:avoid;margin:0 0 14px;display:flex;flex-direction:column;gap:6px;position:relative}
.hit-b{border:1px solid var(--shot-line);border-radius:10px;overflow:hidden;padding:0;background:var(--shot-fill);cursor:zoom-in;display:block;width:100%;min-height:60px}
.hit-b img{display:block;width:100%;height:auto}
.hit figcaption{font-size:12px;line-height:1.35;display:flex;flex-direction:column;overflow-wrap:anywhere;color:var(--shot-ink)}
.hit figcaption b{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hit figcaption span{color:var(--shot-muted)}
.hit-pin{position:absolute;top:6px;right:6px;border:0;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;background:var(--paper);color:var(--ink);cursor:pointer}
.hit-pin[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink)}
.hits-none{padding:10px 8px;font-size:14px;color:var(--shot-muted)}
.else{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.pins{display:flex;flex-direction:column;gap:12px;min-width:0}
.pins-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.pin{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.pin-b{border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;background:var(--shot-bg);cursor:zoom-in;aspect-ratio:3/4;display:block;width:100%}
.pin-b img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.pin figcaption{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);cursor:pointer;font-size:15px;line-height:1}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.6vw,26px);display:flex;flex-direction:column;gap:18px}
.notes-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 26px}
@media (max-width:720px){.notes-g{grid-template-columns:minmax(0,1fr);gap:20px}}
.notes-g h4{font:600 14px var(--f-body);margin:0 0 4px}
.notes-g label{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.notes-g label:focus-within{border-color:var(--accent)}
.notes-g label span{font:500 11px var(--f-mono);color:var(--muted)}
.notes-g input{flex:1;min-width:0;border:0;background:none;padding:11px 0;outline:0}
.notes-g input::placeholder{color:var(--muted);opacity:.75}

/* redesign: what you take with you */
.take{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.6vw,26px);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px clamp(18px,3vw,32px);align-items:start}
.take h3{font-size:21px;grid-column:1/-1}
.take h4{font:600 13px var(--f-body);margin:0 0 8px}
.take ul{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:3px;padding-left:17px;list-style:disc;overflow-wrap:anywhere}
.take .pins-l{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.take-first{border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;background:var(--shot-bg);cursor:zoom-in;display:block;width:100%;max-width:200px;max-height:260px}
.take-first img{display:block;width:100%;height:auto}

/* review + result */
.rev{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
.rev[data-type="mobile"]{grid-template-columns:minmax(0,400px) minmax(0,1fr)}
.rev[data-type="mobile"]>.ba{position:sticky;top:16px}

  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
})();
const dayStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayNo = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 6e4) / 864e5); };
if (S.session && !byId(S.session.cid)) S.session = null;
let view = 'home';

function todays() {
  if (S.pick && S.pick.day === dayStr()) { const c = byId(S.pick.id); if (c) return c; }
  return CH[ORDER[dayNo() % CH.length]];
}
function streak() {
  const days = new Set(S.log.map(l => l.day)); const d = new Date(); let n = 0;
  if (!days.has(dayStr(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const doneMap = () => S.log.reduce((m, l) => m.set(l.cid, (m.get(l.cid) || 0) + 1), new Map());
const niceDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- images: handed-in frames and pasted references live in IndexedDB ---------- */
const DB = (() => {
  const mem = new Map(); let dbp = null; // mem takes over when IndexedDB is unavailable; images then last for this visit only
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('tastetest', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const tx = db.transaction('img', mode), rq = fn(tx.objectStore('img'));
    tx.oncomplete = () => res(rq.result); tx.onerror = tx.onabort = () => rej(tx.error);
  }));
  return {
    put: (k, blob) => run('readwrite', st => st.put(blob, k)).catch(() => { mem.set(k, blob); }),
    get: k => run('readonly', st => st.get(k)).catch(() => null).then(b => b || mem.get(k) || null),
    del: k => { mem.delete(k); return run('readwrite', st => st.delete(k)).catch(() => {}); },
    keys: () => run('readonly', st => st.getAllKeys()).catch(() => []).then(a => [...a, ...mem.keys()]),
  };
})();
const urls = new Map(); // image key -> promise of an object URL ('' when the image is gone)
const urlOf = k => { if (!urls.has(k)) urls.set(k, DB.get(k).then(b => (b ? URL.createObjectURL(b) : ''))); return urls.get(k); };
const dropUrl = k => { const p = urls.get(k); urls.delete(k); if (p) p.then(u => u && URL.revokeObjectURL(u)); };
const putImg = (k, blob) => { dropUrl(k); return DB.put(k, blob); };
const delImg = k => { dropUrl(k); return DB.del(k); };
const imgKey = (s, i) => `${s.id}.${i}`;
const KEEP = 60; // frames are kept for the latest sessions; the log itself is kept in full
async function pruneImages() {
  const keep = new Set(S.log.slice(0, KEEP).map(l => l.id)); if (S.session) keep.add(S.session.id);
  for (const k of await DB.keys()) if (!keep.has(String(k).split('.')[0])) delImg(k);
}
function hydrate(root = V) { // views are written as strings; stored images are filled in right after
  $$('img[data-key]', root).forEach(async im => {
    const u = await urlOf(im.dataset.key); if (!im.isConnected) return;
    if (u) im.src = u; else { const b = im.closest('.ba-b'); if (b) b.outerHTML = '<div class="ba-none">This frame is no longer stored in this browser</div>'; else im.dataset.gone = '1'; }
  });
}
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  const src = URL.createObjectURL(file);
  try {
    const img = await loadImg(src), iw = img.naturalWidth, ih = img.naturalHeight; if (!iw || !ih) throw new Error('empty');
    const k = Math.min(1, maxW / iw, maxH / ih), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(iw * k)); c.height = Math.max(1, Math.round(ih * k));
    const x = c.getContext('2d'); x.fillStyle = tok('--shot-bg'); x.fillRect(0, 0, c.width, c.height); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', .9)); if (!blob) throw new Error('encode');
    return { blob, w: c.width, h: c.height };

}
document.addEventListener('error', e => { // a reference whose thumbnail has expired falls back to the original image, then to an empty tile
  const im = e.target; if (!(im instanceof HTMLImageElement)) return;
  const alt = im.dataset.alt; if (alt) { delete im.dataset.alt; im.src = alt; } else im.dataset.gone = '1';

/* ---------- timer ---------- */
const Chime = (() => { // three short tones when a round ends
  let ctx = null, nodes = [];
  const disarm = () => { nodes.forEach(n => { try { n.stop(); } catch {} }); nodes = []; };
  function arm(sec) { // scheduled on the audio clock, so it sounds on time while this tab sits in the background
    disarm(); if (!S.sound || sec <= 0 || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume();
      [0, .32, .64].forEach((d, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), at = ctx.currentTime + sec + d;
        o.frequency.value = i === 2 ? 880 : 660; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.2, at + .02); g.gain.exponentialRampToValueAtTime(.001, at + .28);
        o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + .3); nodes.push(o);

    } catch {}

})();
let tick = 0;
const running = () => !!(S.session && S.session.runAt);
const leftOf = s => Math.max(0, s.t[s.step] - (s.runAt ? (Date.now() - s.runAt) / 1000 : 0));
const fmt = sec => { const s = Math.ceil(sec); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
function paintTimer() {
  const s = S.session, on = view === 'round' && !!s && s.step <= 3;
  document.title = on ? `${fmt(leftOf(s))} · ${ROUNDS[s.step].name} · TasteTest` : 'TasteTest';
  const el = $('#timer'); if (!el || !on) return;
  const left = leftOf(s), txt = fmt(left), up = left <= 0;
  if (el.dataset.v !== txt) { el.dataset.v = txt; el.innerHTML = [...txt].map(ch => `<span${ch === ':' ? ' class="c"' : ''}>${ch}</span>`).join(''); }
  el.closest('.round').dataset.up = up ? '1' : '0';
  const b = $('#pause'), m = $('#more'), so = $('#sound');
  if (b) { b.textContent = up ? 'Time is up' : running() ? 'Pause' : 'Resume'; b.disabled = up; }
  if (m) m.hidden = !up;
  if (so) { so.textContent = S.sound ? 'Sound on' : 'Sound off'; so.setAttribute('aria-pressed', String(!!S.sound)); }
}
function stopTimer() { // freezes the clock; what is left stays in s.t
  const s = S.session; if (s && s.runAt && s.step <= 3) s.t[s.step] = leftOf(s);
  if (s) s.runAt = 0;
  clearInterval(tick); tick = 0; Chime.disarm(); save(); paintTimer();
}
function startTimer() { // counts on the wall clock, so it keeps going while you are in Figma or this tab sleeps
  const s = S.session; if (!s || s.step > 3 || view !== 'round') return;
  if (leftOf(s) <= 0) { s.t[s.step] = 0; s.runAt = 0; return paintTimer(); }
  if (!s.runAt) { s.runAt = Date.now(); save(); }
  if (!tick) tick = setInterval(() => {
    const cur = S.session; if (!cur || cur.step > 3 || view !== 'round' || !cur.runAt) return stopTimer();
    if (leftOf(cur) <= 0) { cur.t[cur.step] = 0; cur.runAt = 0; clearInterval(tick); tick = 0; save(); }

/* ---------- reference search: Google Programmable Search Element, image results drawn by us ---------- */
const MAXREF = 8;
const okUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u) ? u : '');
const ELSEWHERE = [
  ['Dribbble', q => 'https://dribbble.com/search/' + encodeURIComponent(q)],
  ['Behance', q => 'https://www.behance.net/search/projects?search=' + encodeURIComponent(q)],
  ['Pinterest', q => 'https://www.pinterest.com/search/pins/?q=' + encodeURIComponent(q)],

const defaultQuery = c => c.title.replace(/^Design\s+(the|an?)\s+/i, '').replace(/[.“”]/g, '') + ' UI';
const isPinned = h => !!S.session && S.session.refs.some(r => r.i === h.i && r.u === h.u);
const Search = (() => {
  let st = SEARCH_CX ? 'idle' : 'off', hits = [], wait = 0, want = '';
  const OFF = 'In-page search is not available right now. The links below open the same search in a new tab; copy a screen you like there and paste it here to pin it.';
  const say = (text, off) => { const e = $('#hits-msg'), b = $('#hits-box'); if (!e) return; e.hidden = !text; e.textContent = text || ''; b.dataset.off = off ? '1' : '0'; };
  const toHit = r => {
    const rs = r.richSnippet || {}, t = okUrl(r.thumbnailImage && r.thumbnailImage.url) || okUrl(rs.cseThumbnail && rs.cseThumbnail.src), i = okUrl(r.image && r.image.url) || okUrl(rs.cseImage && rs.cseImage.src);
    return t || i ? { t: t || i, i: i || t, u: okUrl(r.contextUrl) || okUrl(r.url), title: String(r.titleNoFormatting || '').slice(0, 140), host: String(r.visibleUrl || '').slice(0, 60) } : null;
  };
  const hitsHTML = () => `<div class="hits">${hits.map((h, i) => `<figure class="hit"><button type="button" class="hit-b" data-hit="${i}" aria-label="Enlarge: ${esc(h.title)}"><img src="${esc(h.t)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button><figcaption><b>${esc(h.title)}</b><span>${esc(h.host)}</span></figcaption><button type="button" class="hit-pin" data-pin="${i}" aria-pressed="${isPinned(h)}">${isPinned(h) ? 'Pinned' : 'Pin'}</button></figure>`).join('')}</div>`;
  function ready(name, q, promos, results, div) { // returning true tells Google we drew the results; its own footer and paging stay below
    clearTimeout(wait); hits = (results || []).map(toHit).filter(Boolean);
    div.innerHTML = hits.length ? hitsHTML() : '<p class="hits-none">Nothing found for this search. Try fewer or other words.</p>';
    say('');
    return true;
  }
  function load() {
    st = 'loading';
    window.__gcse = { parsetags: 'explicit', initializationCallback: () => { st = 'ready'; clearTimeout(wait); if (want) run(want); }, searchCallbacks: { image: { ready }, web: { ready } } };
    const sc = document.createElement('script'); sc.async = true; sc.src = 'https://cse.google.com/cse.js?cx=' + encodeURIComponent(SEARCH_CX);
    sc.onerror = () => { st = 'off'; say(OFF, true); };

    document.head.append(sc);
  }

    q = String(q || '').trim().slice(0, 120); if (!q) return;

    const el = $('#else'); if (el) el.innerHTML = '<span>Also search on</span>' + ELSEWHERE.map(([n, f]) => `<a href="${esc(f(q))}" target="_blank" rel="noopener noreferrer">${n} ↗</a>`).join('');

/* review maths: every principle is ticked for the first version and for the redesign */

  const sk = {}; Object.keys(SKILLS).forEach(key => { sk[key] = { key, n: 0, held: 0, gain: 0, e: [0, 0], r: [0, 0], lastHeld: '', lastGain: '', lastMiss: '' }; });
  const half = L.length >= 4 ? Math.floor(L.length / 2) : 0; // from four sessions on, the earlier half is compared with the later half

    if (half) { const h = li < half ? o.e : o.r; h[1]++; if (c[0]) h[0]++; }
  }));
  const all = Object.values(sk).filter(o => o.n), pct = (a, n) => Math.round(100 * a / n), miss = o => o.n - o.held - o.gain, rise = o => o.r[0] / o.r[1] - o.e[0] / o.e[1];
  const hold = all.filter(o => o.held / o.n >= .6).sort((x, y) => y.held / y.n - x.held / x.n || y.n - x.n).slice(0, 3)
    .map(o => [SKILLS[o.key], `In both versions, ${o.held} out of ${o.n}. Last: ${o.lastHeld}.`]);
  const trend = all.filter(o => o.e[1] >= 2 && o.r[1] >= 2 && rise(o) >= .15).sort((x, y) => rise(y) - rise(x));
  const better = trend.map(o => [SKILLS[o.key], `Your first versions went from ${pct(o.e[0], o.e[1])}% to ${pct(o.r[0], o.r[1])}%.`])
    .concat(all.filter(o => o.gain && !trend.includes(o)).sort((x, y) => y.gain / y.n - x.gain / x.n).map(o => [SKILLS[o.key], `Added in the redesign, ${o.gain} out of ${o.n}. Last: ${o.lastGain}.`])).slice(0, 3);

  const cols = recent.map(l => {

  }).join('');

  return head + `<div class="trio">${trioBox('a', 'You hold on to', hold, 'No skill stands out yet. Keep reviewing.')}${trioBox('b', 'You got better at', better, 'Nothing yet. This fills up when a redesign adds something.')}${trioBox('c', 'Still to work on', work, 'Nothing stands out. Try a kind of screen you have not done yet.')}</div>
    <div class="prog-g">

  const k = KINDS[l.kind], type = TYPES[l.type] ? l.type : 'mobile';
  const groups = NOTES.map(g => { const v = ((l.notes || {})[g.k] || []).filter(x => String(x).trim()); return v.length ? `<div><h4>${g.own}</h4><ul>${v.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''; }).join('');
  const refs = (l.refs || []).filter(r => okUrl(r.u)).map(r => `<li><a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${esc(r.title || r.host || 'Reference')}</a></li>`).join('');
  openDlg(`<div class="lg"><div class="brief"><span class="eyebrow">${esc(niceDate(l.finishedAt))} · challenge ${pad(Number(l.n) || 0, 3)} · ${Number(l.mins) || 0} min</span><h3>${esc(l.title)}</h3>${l.takeaway ? `<p>${esc(l.takeaway)}</p>` : ''}</div>
    ${baHTML(l.id, l.dim, type)}${k && Array.isArray(l.checks) ? trioHTML(l.checks, k) : ''}${groups ? `<div class="lg-n">${groups}</div>` : ''}${refs ? `<div class="lg-r"><h4>References you pinned</h4><ul>${refs}</ul></div>` : ''}
    <div><button type="button" class="btn ghost" data-close>Close</button></div></div>`, true);
  hydrate(DI);
}

/* ---------- saving files ---------- */
function saveFile(name, blob) {
  const a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function comparePNG(s, c) {
  const imgs = await Promise.all([0, 1].map(async i => { const u = s.dim[i] ? await urlOf(imgKey(s, i)) : ''; return u ? loadImg(u) : null; }));
  const mobile = c.type === 'mobile', bw = mobile ? 360 : 640, cap = mobile ? 900 : 1100, P = 48, G = 40, W = P * 2 + bw * 2 + G;
  const hs = imgs.map(im => (im ? Math.min(cap, Math.round(im.naturalHeight * bw / im.naturalWidth)) : Math.round(bw * .6)));
  const cv = document.createElement('canvas'), x = cv.getContext('2d'); x.font = '600 26px "Helvetica Neue", Helvetica, Arial, sans-serif';
  const lines = []; let line = '';
  for (const w of String(c.title).split(' ')) { if (line && x.measureText(line + w).width > W - P * 2) { lines.push(line.trim()); line = ''; } line += w + ' '; }
  lines.push(line.trim());
  const top = P + lines.length * 32 + 58, H = top + Math.max(...hs) + P, n = tally(s.checks);
  cv.width = W * 2; cv.height = H * 2; x.scale(2, 2); x.fillStyle = tok('--paper'); x.fillRect(0, 0, W, H);
  x.textBaseline = 'top'; x.fillStyle = tok('--ink'); x.font = '600 26px "Helvetica Neue", Helvetica, Arial, sans-serif';
  lines.forEach((t, i) => x.fillText(t, P, P - 8 + i * 32));
  x.font = '500 12px "JetBrains Mono", ui-monospace, monospace'; x.fillStyle = tok('--muted');
  x.fillText(`TASTETEST · HELD ${n.held} · GAINED ${n.gain} · OPEN ${n.open + n.lost}`, P, P + lines.length * 32);
  ['FIRST VERSION', 'REDESIGN'].forEach((label, i) => {
    const ox = P + i * (bw + G), im = imgs[i]; x.fillStyle = tok('--muted'); x.fillText(label, ox, top - 22);
    if (im) x.drawImage(im, 0, 0, im.naturalWidth, hs[i] * im.naturalWidth / bw, ox, top, bw, hs[i]);
    x.strokeStyle = tok('--line'); x.lineWidth = 1; x.strokeRect(ox + .5, top + .5, bw - 1, hs[i] - 1);
  });
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

/* ---------- export and import: one JSON file with the log and the stored images ---------- */
const blobToData = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportData() {
  save(); const images = {};
  for (const k of await DB.keys()) { const b = await DB.get(k); if (b) images[k] = await blobToData(b); }
  saveFile(`tastetest-${dayStr()}.json`, new Blob([JSON.stringify({ app: 'tastetest', v: 2, exportedAt: new Date().toISOString(), state: { log: S.log }, images })], { type: 'application/json' }));
  return S.log.length;
}
function cleanEntry(l) { // an imported file is untrusted: rebuild every entry from known fields
  const c = l && byId(l.cid), k = c && KINDS[c.kind]; if (!k || typeof l.id !== 'string' || !/^s[a-z0-9]+$/.test(l.id)) return null;
  const txt = (v, n) => String(v ?? '').slice(0, n), three = a => [0, 1, 2].map(i => txt(Array.isArray(a) ? a[i] : '', 160)), notes = l.notes || {};
  const dim = d => (Array.isArray(d) && d[0] > 0 && d[1] > 0 ? [Number(d[0]), Number(d[1])] : null);
  return { id: l.id, cid: c.id, kind: c.kind, type: c.type, n: Number(l.n) || 0, title: c.title, day: /^\d{4}-\d\d-\d\d$/.test(l.day) ? l.day : dayStr(),
    finishedAt: isNaN(new Date(l.finishedAt)) ? new Date().toISOString() : String(l.finishedAt), mins: Number(l.mins) || 0, dim: [0, 1].map(i => dim((l.dim || [])[i])),
    checks: k.checks.map((_, i) => { const x = (l.checks || [])[i] || []; return [!!x[0], !!x[1]]; }), notes: { p: three(notes.p), d: three(notes.d), x: three(notes.x) },
    refs: (Array.isArray(l.refs) ? l.refs : []).slice(0, MAXREF).filter(r => r && typeof r === 'object').map(r => { const id = txt(r.id, 24).replace(/[^a-z0-9]/g, ''); return { id, key: r.key === `${l.id}.r.${id}` ? r.key : '', t: okUrl(r.t), i: okUrl(r.i), u: okUrl(r.u), title: txt(r.title, 140), host: txt(r.host, 60) }; }),
    takeaway: txt(l.takeaway, 200) };
}
async function importData(file) { // merges: sessions in the file are added, a session that is already here is replaced by the one in the file
  const d = JSON.parse(await file.text()); if (!d || d.app !== 'tastetest' || !d.state || !Array.isArray(d.state.log)) throw new Error('format');
  const got = d.state.log.map(cleanEntry).filter(Boolean), ids = new Set(got.map(l => l.id));
  S.log = got.concat(S.log.filter(l => !ids.has(l.id))).sort((a, b) => String(b.finishedAt).localeCompare(String(a.finishedAt)));
  for (const [k, u] of Object.entries(d.images || {})) {
    if (!/^s[a-z0-9]+\.(0|1|r\.[a-z0-9]+)$/.test(k) || !ids.has(k.split('.')[0]) || typeof u !== 'string' || !/^data:image\/(jpeg|png|webp);base64,/.test(u)) continue;
    await putImg(k, await (await fetch(u)).blob());
  }
  save(); pruneImages();
  return got.length;
}

/* ---------- events ---------- */
$('#home').addEventListener('click', renderHome);
$('#steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b && !b.disabled && S.session) go(Number(b.dataset.step)); });
let sureT = 0;
function sure(t, ask, back) { // destructive or lossy steps need a second click within four seconds
  if (t.dataset.sure) { clearTimeout(sureT); return true; }
  t.dataset.sure = '1'; t.textContent = ask; sureT = setTimeout(() => { if (t.isConnected) { delete t.dataset.sure; t.textContent = back; } }, 4000);
  return false;
}
V.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const s = S.session, c = s && byId(s.cid);
  if (t.id === 'go') { if (!s) { newSession(todays()); go(0); } else go(s.step); }
  else if (t.id === 'other') { const done = doneMap(), now = todays().id, pool = CH.filter(x => !done.has(x.id) && x.id !== now), from = pool.length ? pool : CH; S.pick = { id: from[Math.floor(Math.random() * from.length)].id, day: dayStr() }; save(); renderHome(); }
  else if (t.id === 'browse') $('#lib').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  else if (t.id === 'drop') { if (sure(t, 'Are you sure? Your frames will be removed', 'Stop this session')) { S.session = null; save(); pruneImages(); renderHome(); } }
  else if (t.dataset.type && t.closest('#lib-types')) { lib.type = t.dataset.type; lib.kind = 'all'; lib.n = 12; paintLib(); }
  else if (t.dataset.kind) { lib.kind = t.dataset.kind; lib.n = 12; paintLib(); }
  else if (t.id === 'lib-more') { lib.n += 24; paintLib(); }
  else if (t.dataset.ch) openCh(t.dataset.ch);
  else if (t.dataset.log) openLog(t.dataset.log);
  else if (t.dataset.zoom) zoomKey(t.dataset.zoom, t.dataset.type);
  else if (t.id === 'export') { const st = $('#data-status'); st.textContent = 'Preparing the file…'; exportData().then(n => { st.textContent = `Exported ${n} ${n === 1 ? 'session' : 'sessions'} with their frames. Keep the file somewhere safe.`; }).catch(() => { st.textContent = 'The export could not be made.'; }); }
  else if (!s) return;
  else if (t.id === 'pause') { if (running()) stopTimer(); else startTimer(); }
  else if (t.id === 'more') { s.t[s.step] = 300; s.extra = (s.extra || 0) + 300; startTimer(); }
  else if (t.id === 'sound') { S.sound = !S.sound; save(); if (running()) Chime.arm(leftOf(s)); else Chime.disarm(); paintTimer(); }
  else if (t.id === 'next') { const i = handIdx(s); if (i < 0 || s.dim[i] || sure(t, 'No frame handed in. Continue anyway?', nextLabel(s))) go(s.step + 1); }
  else if (t.id === 'hand-clear') { const i = handIdx(s); if (i >= 0) { s.dim[i] = null; delImg(imgKey(s, i)); save(); paintHand('Removed.'); } }
  else if (t.dataset.q) { $('#find-q').value = t.dataset.q; Search.run(t.dataset.q); }
  else if (t.dataset.pin) togglePin(Number(t.dataset.pin));
  else if (t.dataset.hit) { const h = Search.hit(Number(t.dataset.hit)); if (h) zoomRef(h, Number(t.dataset.hit)); }
  else if (t.dataset.unpin) removeRef(t.dataset.unpin);
  else if (t.dataset.ref) { const r = s.refs.find(x => x.id === t.dataset.ref); if (r) zoomRef(r, -1); }
  else if (t.dataset.chk) {
    const i = Number(t.dataset.chk), v = Number(t.dataset.v); s.checks[i][v] = !s.checks[i][v]; save();
    t.setAttribute('aria-pressed', String(s.checks[i][v])); t.closest('li').dataset.st = stOf(s.checks[i]);
    $('#trio').innerHTML = trioHTML(s.checks, KINDS[c.kind]);
  }
  else if (t.id === 'done') { S.session = null; save(); renderHome(); window.scrollTo(0, 0); }
  else if (t.id === 'png') comparePNG(s, c).then(b => b && saveFile('tastetest-before-and-after.png', b)).catch(() => { $('#res-status').textContent = 'The PNG could not be made.'; });
});
V.addEventListener('submit', e => { if (e.target.id === 'find') { e.preventDefault(); Search.run($('#find-q').value); } });
V.addEventListener('input', e => {
  const t = e.target, s = S.session;
  if (t.id === 'lib-q') { lib.q = t.value; lib.n = 12; paintLib(); }
  else if (!s) return;
  else if (t.dataset.n) { s.notes[t.dataset.n][Number(t.dataset.i)] = t.value; saveSoon(); }
  else if (t.id === 'takeaway') { s.takeaway = t.value; saveSoon(); }
});
V.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (e.target.id === 'hand-file') { e.target.value = ''; takeDesign(f); }
  else if (e.target.id === 'import-file') {
    e.target.value = ''; $('#data-status').textContent = 'Importing…';
    importData(f).then(n => { renderHome(); $('#data-status').textContent = n ? `Imported ${n} ${n === 1 ? 'session' : 'sessions'}.` : 'That file holds no sessions this version knows.'; $('#log').scrollIntoView(); })
      .catch(() => { $('#data-status').textContent = 'That is not a TasteTest export file.'; });
  }
});
document.addEventListener('paste', e => { // a frame copied as PNG in Figma, or a screenshot for Study, lands here
  if (!activeDrop || !e.clipboardData || D.open) return;
  const it = [...e.clipboardData.items].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (it) { e.preventDefault(); activeDrop(it.getAsFile()); }
});
const hasFiles = e => !!e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
const zone = () => $('[data-zone]', V);
V.addEventListener('dragover', e => { if (activeDrop && hasFiles(e) && zone()) { e.preventDefault(); zone().dataset.drop = '1'; } });
V.addEventListener('dragleave', e => { const z = zone(); if (z && !z.contains(e.relatedTarget)) z.dataset.drop = '0'; });
V.addEventListener('drop', e => { const z = zone(); if (!activeDrop || !hasFiles(e) || !z) return; e.preventDefault(); z.dataset.drop = '0'; activeDrop(e.dataTransfer.files[0]); });
document.addEventListener('pointerdown', () => { const s = S.session; if (s && running() && Chime.idle()) Chime.arm(leftOf(s)); }); // sound needs one touch after a reload
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else paintTimer(); });
window.addEventListener('pagehide', save);

if (S.session && S.session.runAt && S.session.step <= 3) { view = 'round'; renderRound(); startTimer(); } else renderHome(); // a running clock survives a reload
})();
