<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TasteTest</title>
<meta name="description" content="Train your eye for design. One challenge a day in four rounds: design, study references, compare with the analysis and redesign.">
<meta property="og:title" content="TasteTest">
<meta property="og:description" content="Train your eye for design. One challenge a day in four rounds: design, study references, compare with the analysis and redesign.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f1f1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f14" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316161d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffe55a'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2316161d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..600&display=swap">
<style>
/* Layout: one calm column, max 1120px. The 60-minute routine drawn to scale is the recurring motif;
   on a round screen the stopwatch is the loudest thing. Reference screens and the artboard are "paper":
   they keep their own light palette in both themes, like screenshots would. */
:root{
  --paper:#f1f1f5; --surface:#ffffff; --sunk:#e7e7ee; --ink:#16161d; --muted:#5f5f6d; --line:#dadae4;
  --accent:#3a36e0; --accent-ink:#ffffff; --accent-soft:#e7e6fb;
  --mark:#ffe55a; --mark-ink:#16161d; --scrim:rgb(12 12 20 / .62); --shadow:rgb(20 20 40 / .35);
  --shot-bg:#ffffff; --shot-ink:#1a1a21; --shot-muted:#868693; --shot-line:#e3e3ea; --shot-fill:#f2f2f6; --shot-on:#ffffff;
  --shot-ok:#1c7a4c; --shot-err:#c9362b; --shot-warn:#9a4a12; --shot-good-bg:#e4f4ea; --shot-warn-bg:#fbeedd; --shot-accent:#2b5fd9;
  --f-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f0f14; --surface:#18181f; --sunk:#202029; --ink:#ececf2; --muted:#a0a0af; --line:#2f2f3b;
    --accent:#918eff; --accent-ink:#0f0f14; --accent-soft:#232247;
    --mark:#6b5c00; --mark-ink:#fff3b0; --scrim:rgb(0 0 0 / .7); --shadow:rgb(0 0 0 / .6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f0f14; --surface:#18181f; --sunk:#202029; --ink:#ececf2; --muted:#a0a0af; --line:#2f2f3b;
  --accent:#918eff; --accent-ink:#0f0f14; --accent-soft:#232247;
  --mark:#6b5c00; --mark-ink:#fff3b0; --scrim:rgb(0 0 0 / .7); --shadow:rgb(0 0 0 / .6); color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ol,ul,figure{margin:0}
ol,ul{padding:0;list-style:none}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1120px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px);padding-block:18px 72px;display:flex;flex-direction:column;gap:26px}
#view{display:flex;flex-direction:column;gap:clamp(26px,4vw,44px)}
#view>section{display:flex;flex-direction:column;gap:clamp(18px,2.6vw,28px)}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.status{font-size:13px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-weight:600;font-size:14.5px;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.quiet{background:transparent;color:var(--muted);padding-inline:8px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:no-preference){.btn,.tick,.tools button,.steps button{transition:background-color .15s,color .15s,border-color .15s}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;min-height:44px}
.mark{font:600 19px/1 var(--f-display);letter-spacing:-.02em;background:none;border:0;padding:8px 0;cursor:pointer;display:inline-flex;align-items:baseline;gap:3px}
.mark i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.steps{display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;max-width:100%}
.steps button{border:0;background:none;border-radius:999px;padding:7px 13px;font-size:13px;display:flex;gap:7px;align-items:baseline;cursor:pointer;color:var(--muted)}
.steps button span{font:500 11px var(--f-mono)}
.steps button b{font-weight:500}
.steps button[aria-current="step"]{background:var(--ink);color:var(--paper)}
.steps button:disabled{opacity:.42;cursor:default}
.streak{font:500 12px var(--f-mono);color:var(--muted)}
@media (max-width:560px){.steps button:not([aria-current]) b{display:none}}

/* home */
.hero{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(22px,4vw,52px)!important;align-items:end;padding-top:clamp(8px,3vw,36px)}
.hero h1{font-size:clamp(42px,7.4vw,88px);letter-spacing:-.04em;line-height:.94;margin-block:16px 20px}
.hero h1 mark{background:linear-gradient(transparent 60%,var(--mark) 60%);color:inherit;padding-inline:.04em}
.lead{font-size:17px;max-width:46ch;color:var(--muted)}
.today{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,2.4vw,26px);display:flex;flex-direction:column;gap:12px}
.today h2{font-size:clamp(22px,2.5vw,29px)}
.today>p{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
@media (max-width:840px){.hero{grid-template-columns:minmax(0,1fr)}}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.sec-h h2{font-size:24px}
.sec-h p{font:500 12px var(--f-mono);color:var(--muted)}
.track{gap:10px!important}
.ruler{position:relative;height:16px;font:500 11px/1 var(--f-mono);color:var(--muted)}
.ruler span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ruler span:first-child{transform:none}
.ruler span:last-child{transform:translateX(-100%)}
.track ol{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.track li{flex-basis:0;flex-shrink:1;min-width:0;padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line)}
.track li:first-child{border-left:0}
.track li b{font:600 20px/1.1 var(--f-display);letter-spacing:-.02em}
.track li p{font-size:13.5px;color:var(--muted)}
.track .k{font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
@media (max-width:720px){.ruler{display:none}.track ol{flex-direction:column}.track li{border-left:0;border-top:1px solid var(--line)}.track li:first-child{border-top:0}}

.log{gap:14px!important}
.log-l li{border-top:1px solid var(--line)}
.log-l li:last-child{border-bottom:1px solid var(--line)}
.log-l button{width:100%;display:grid;grid-template-columns:72px minmax(0,1.3fr) 124px minmax(0,1.6fr);gap:2px 16px;align-items:baseline;padding:13px 4px;background:none;border:0;text-align:left;cursor:pointer}
.log-l time,.log-l span{font:500 12px var(--f-mono);color:var(--muted)}
.log-l b{font-weight:600;overflow-wrap:anywhere}
.log-l em{font-style:normal;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:720px){.log-l button{grid-template-columns:64px minmax(0,1fr)}.log-l span,.log-l em{grid-column:2}}
.log-empty{border:1px dashed var(--line);border-radius:16px;padding:20px 22px;color:var(--muted)}

/* round */
.clock{display:flex;align-items:center;gap:14px clamp(14px,3vw,30px);flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.clock-t{font:500 clamp(54px,10.5vw,108px)/.88 var(--f-display);letter-spacing:-.03em;white-space:nowrap}
.clock-t span{display:inline-block;width:.57em;text-align:center}
.clock-t span.c{width:.26em}
.round[data-up="1"] .clock-t{color:var(--accent)}
.clock-n{display:flex;flex-direction:column;gap:8px;padding-left:clamp(14px,3vw,30px);border-left:1px solid var(--line)}
.clock-n h1{font-size:clamp(32px,6vw,64px);font-weight:500;letter-spacing:-.03em}
.clock-c{margin-left:auto;display:flex;gap:8px}
.brief{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.brief h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.03em}
.brief h2{font-size:clamp(24px,3.3vw,36px)}
.brief h3{font-size:22px}
.brief p{color:var(--muted)}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
.next p{color:var(--muted);max-width:60ch}

/* drawing board */
.board{background:var(--sunk);border-radius:22px;padding:clamp(10px,1.8vw,16px);display:flex;flex-direction:column;gap:12px;min-width:0}
.tools{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-wrap:wrap;gap:6px 10px;padding:6px;justify-content:space-between}
.tools>div{display:flex;flex-wrap:wrap;gap:2px}
.tools button{border:0;background:none;border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tools button:disabled{opacity:.38;cursor:default}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;color:var(--muted);padding-inline:6px}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
.opts input[type=color]{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface);cursor:pointer}
.opts input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
.opts select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 8px}
.stage{display:flex;justify-content:center;padding-block:6px 12px}
.art{position:relative;width:min(100%,360px);max-width:100%;aspect-ratio:1/2;background:var(--shot-bg);border-radius:20px;overflow:hidden;box-shadow:0 18px 34px -24px var(--shadow)}
.art canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.art[data-empty="1"]::after{content:"Draw your screen here";position:absolute;inset:0;display:grid;place-items:center;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--shot-muted);pointer-events:none}
.art-text{position:absolute;min-width:60px;max-width:90%;border:0;border-bottom:1px dashed var(--shot-accent);background:transparent;padding:0;margin:0;outline:0;font-family:var(--f-body);font-weight:500;line-height:1.2}

/* design source: sketch here, or bring a frame in from Figma */
.src{display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:13px;align-self:flex-start;max-width:100%}
.src button{border:0;background:none;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.src button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sk{display:flex;flex-direction:column;gap:12px;min-width:0}
.fg{display:grid;grid-template-columns:minmax(0,1fr) min(360px,46%);gap:18px clamp(16px,3vw,36px);align-items:start;padding:8px 6px 4px}
@media (max-width:760px){.fg{grid-template-columns:minmax(0,1fr)}}
.board[data-drop="1"]{outline:2px dashed var(--accent);outline-offset:-6px}
.fg-how{display:flex;flex-direction:column;gap:16px;max-width:50ch;font-size:14px;min-width:0}
.fg-how h3{font-size:21px}
.fg-how ol{list-style:decimal;padding-left:19px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.fg-how kbd{font:500 12px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:1px 5px;background:var(--surface);color:var(--ink);white-space:nowrap}
.fg-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fg-url{display:flex;flex-direction:column;gap:6px}
.fg-url label{font-weight:600;font-size:13px}
.fg-url input{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0}
.vh:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.fg .stage{padding-block:0}
.fg .art{width:100%}
.fg .art img{display:block;width:100%;height:100%;object-fit:contain;object-position:top}
#fg-art[data-empty="1"]::after{content:"Your Figma frame goes here"}

/* reference screens */
.refs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2vw,22px)}
@media (max-width:720px){.refs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ref{display:flex;flex-direction:column;gap:10px;min-width:0}
.ref-b{border:0;padding:0;background:none;cursor:zoom-in;border-radius:16px;display:block;width:100%;text-align:left}
.ref figcaption b{display:block;font-weight:600}
.ref figcaption span{display:block;color:var(--muted);font-size:13px}
.ph{container-type:inline-size;width:100%;max-width:100%;aspect-ratio:9/18;background:var(--shot-bg);color:var(--shot-ink);border-radius:16px;border:1px solid var(--line);overflow:hidden;box-shadow:0 16px 30px -26px var(--shadow)}
.ph-s{font:400 9px/1.3 var(--f-body);font-size:4.3cqw;height:100%;display:flex;flex-direction:column;gap:.75em;padding:1.5em 1.15em 1.3em;overflow:hidden}
.ph-s::before{content:"9:41";font-size:.8em;font-weight:600;margin-bottom:.2em}
.ph-s>*{flex:none;min-width:0}
.ph-s>.b-sp{flex:1 1 0;min-height:.2em}
.b-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.b-bar b{font-weight:600}
.b-bar span:first-child{font-size:1.25em;line-height:1}
.b-bar span:last-child{text-align:right;color:var(--shot-accent);font-size:.88em}
.b-steps{display:flex;gap:.4em;font-size:.7em;color:var(--shot-muted)}
.b-steps span{flex:1;border-top:.3em solid var(--shot-line);padding-top:.5em}
.b-steps .done{border-color:var(--shot-ink);color:var(--shot-ink)}
.b-steps .on{border-color:var(--shot-accent);color:var(--shot-ink);font-weight:600}
.b-h{font:600 1.5em/1.12 var(--f-display);letter-spacing:-.02em}
.b-p{font-size:.82em;color:var(--shot-muted)}
.b-l{font-size:.64em;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--shot-muted);margin-top:.3em}
.b-row{display:flex;align-items:center;gap:.7em;padding:.68em .85em;border:1px solid var(--shot-line);border-radius:.85em;font-size:.84em}
.b-row>div{flex:1;min-width:0}
.b-row b{display:block;font-weight:600}
.b-row small{display:block;font-size:.88em;color:var(--shot-muted)}
.b-row>span{flex:none;color:var(--shot-muted);font-variant-numeric:tabular-nums}
.b-row.sel{border-color:var(--shot-ink);box-shadow:inset 0 0 0 1px var(--shot-ink)}
.b-row.off{opacity:.42}
.b-row>i{flex:none;width:1.25em;height:1.25em;border-radius:50%;border:.12em solid var(--shot-muted);font-style:normal}
.b-radio.sel>i{border:.38em solid var(--shot-accent)}
.b-check>i{border-radius:.35em;display:grid;place-items:center;font-size:.9em;color:var(--shot-on)}
.b-check.on>i{background:var(--shot-accent);border-color:var(--shot-accent)}
.b-check.on b{text-decoration:line-through;color:var(--shot-muted)}
.b-tog{display:flex;justify-content:space-between;align-items:center;font-size:.84em}
.b-tog i{width:2.5em;height:1.45em;border-radius:1em;background:var(--shot-line);position:relative}
.b-tog i::after{content:"";position:absolute;top:.15em;left:.15em;width:1.15em;height:1.15em;border-radius:50%;background:var(--shot-bg)}
.b-tog.on i{background:var(--shot-accent)}
.b-tog.on i::after{left:1.2em}
.b-in{display:flex;flex-direction:column;gap:.3em;font-size:.84em}
.b-in label{font-size:.82em;color:var(--shot-muted)}
.b-in div{display:flex;justify-content:space-between;align-items:center;min-height:2.7em;padding:.55em .8em;border:1px solid var(--shot-line);border-radius:.75em}
.b-in.focus div{border-color:var(--shot-accent);box-shadow:0 0 0 .2em color-mix(in srgb,var(--shot-accent) 22%,transparent)}
.b-in.ok div::after{content:"✓";color:var(--shot-ok)}
.b-in.err div{border-color:var(--shot-err)}
.b-in.err small{color:var(--shot-err);font-size:.82em}
.b-btn{text-align:center;padding:.9em .6em;border-radius:.9em;font-weight:600;font-size:.9em;background:var(--shot-accent);color:var(--shot-on)}
.b-btn.sec{background:var(--shot-fill);color:var(--shot-ink)}
.b-btn.dark{background:var(--shot-ink);color:var(--shot-on)}
.b-btn.off{background:var(--shot-fill);color:var(--shot-muted)}
.b-link{text-align:center;font-size:.8em;font-weight:600;color:var(--shot-accent)}
.b-or{display:flex;align-items:center;gap:.7em;font-size:.72em;color:var(--shot-muted)}
.b-or::before,.b-or::after{content:"";flex:1;height:1px;background:var(--shot-line)}
.b-sum{display:flex;flex-direction:column;gap:.35em;font-size:.82em;color:var(--shot-muted);font-variant-numeric:tabular-nums}
.b-sum div{display:flex;justify-content:space-between;gap:1em}
.b-sum .tot{color:var(--shot-ink);font-weight:600;font-size:1.08em;padding-top:.5em;border-top:1px solid var(--shot-line)}
.b-chips{display:flex;flex-wrap:wrap;gap:.45em;font-size:.84em}
.b-chips span{min-width:2.9em;text-align:center;padding:.58em .7em;border:1px solid var(--shot-line);border-radius:.7em;font-weight:600}
.b-chips .on{background:var(--shot-ink);color:var(--shot-on);border-color:var(--shot-ink)}
.b-chips .off{color:var(--shot-muted);text-decoration:line-through;background:var(--shot-fill)}
.b-seg{display:flex;padding:.2em;background:var(--shot-fill);border-radius:.8em;font-size:.82em;text-align:center}
.b-seg span{flex:1;padding:.5em;border-radius:.65em;color:var(--shot-muted)}
.b-seg .on{background:var(--shot-bg);color:var(--shot-ink);font-weight:600;box-shadow:0 .05em .25em var(--shot-line)}
.b-img{border-radius:1em;border:1px solid var(--shot-line);background:repeating-linear-gradient(135deg,var(--shot-fill) 0 .7em,var(--shot-bg) .7em 1.4em);display:grid;place-items:center}
.b-img span{font-size:.72em;color:var(--shot-muted)}
.b-note{font-size:.78em;padding:.7em .85em;border-radius:.8em;background:var(--shot-fill)}
.b-note.good{background:var(--shot-good-bg);color:var(--shot-ok)}
.b-note.warn{background:var(--shot-warn-bg);color:var(--shot-warn)}
.b-big{display:flex;flex-direction:column;gap:.15em}
.b-big b{font:600 2.7em/1 var(--f-display);letter-spacing:-.03em}
.b-big small{font-size:.8em;color:var(--shot-muted)}
.b-prog{display:flex;flex-direction:column;gap:.4em}
.b-prog small{font-size:.76em;color:var(--shot-muted)}
.b-prog div{height:.5em;border-radius:.3em;background:var(--shot-fill);overflow:hidden}
.b-prog i{display:block;height:100%;border-radius:.3em;background:var(--shot-accent)}
.b-bars{display:flex;align-items:flex-end;gap:.5em;height:6.5em;border-bottom:1px solid var(--shot-line)}
.b-bars i{flex:1;border-radius:.3em .3em 0 0;background:var(--shot-accent)}
.b-dots{display:flex;justify-content:center;gap:.4em}
.b-dots i{width:.45em;height:.45em;border-radius:.3em;background:var(--shot-line)}
.b-dots .on{background:var(--shot-ink);width:1.2em}
.b-tabs{display:flex;justify-content:space-around;font-size:.7em;color:var(--shot-muted);border-top:1px solid var(--shot-line);padding:.9em 1.2em 0;margin-inline:-1.2em}
.b-tabs .on{color:var(--shot-ink);font-weight:600}
.b-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5em;padding-block:2.2em 1em}
.b-empty i{width:4.2em;height:4.2em;border-radius:50%;background:var(--shot-fill);border:1px solid var(--shot-line)}
.b-empty b{font:600 1.4em/1.15 var(--f-display)}
.b-empty small{font-size:.82em;color:var(--shot-muted);max-width:19em}

/* study notes */
.notes{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.6vw,26px);display:flex;flex-direction:column;gap:18px}
.notes h3{font-size:22px}
.notes-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 26px}
@media (max-width:720px){.notes-g{grid-template-columns:minmax(0,1fr);gap:20px}}
.notes-g h4{font:600 14px var(--f-body);margin:0 0 4px}
.notes-g label{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.notes-g label:focus-within{border-color:var(--accent)}
.notes-g label span{font:500 11px var(--f-mono);color:var(--muted)}
.notes-g input{flex:1;min-width:0;border:0;background:none;padding:11px 0;outline:0}
.notes-g input::placeholder{color:var(--muted);opacity:.75}

/* compare */
.cmp{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
@media (max-width:880px){.cmp{grid-template-columns:minmax(0,1fr)}}
.obs{display:flex;flex-direction:column;gap:16px;min-width:0}
.obs ol li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:6px 12px;padding-block:16px;border-top:1px solid var(--line);align-items:start}
.obs ol li:last-child{border-bottom:1px solid var(--line)}
.obs .num{font:500 11px var(--f-mono);color:var(--muted);padding-top:5px}
.obs li h3{font:600 16px/1.35 var(--f-body);letter-spacing:0}
.obs li p{color:var(--muted);margin-top:4px;max-width:62ch}
.obs li.seen h3 span{background:linear-gradient(transparent 55%,var(--mark) 55%)}
.tick{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tick[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:transparent;font-weight:600}
@media (max-width:520px){.obs ol li{grid-template-columns:26px minmax(0,1fr)}.tick{grid-column:2;justify-self:start}}
.again summary{cursor:pointer;font-weight:600;padding-block:4px}
.again .refs{margin-top:14px}
.eye,.take{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eye h3,.take h3{font-size:21px}
.eye>p,.take>p{font-size:13.5px;color:var(--muted)}
.eye h4{font:600 13px var(--f-body);margin:0 0 4px}
.eye ul{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:3px;padding-left:17px;list-style:disc;overflow-wrap:anywhere}
.count{background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.count b{font:600 18px var(--f-display);letter-spacing:-.01em}
.count p{font-size:13px;color:var(--muted);margin-top:4px}

/* redesign + result */
.re{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:clamp(16px,3vw,28px);align-items:start}
@media (max-width:880px){.re{grid-template-columns:minmax(0,1fr)}}
.take ul{display:flex;flex-direction:column;gap:7px;font-size:14px;overflow-wrap:anywhere}
.take li{padding-left:15px;position:relative}
.take li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.res{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(18px,4vw,48px);align-items:start}
@media (max-width:880px){.res{grid-template-columns:minmax(0,1fr)}}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.4vw,24px)}
.ba figure{display:flex;flex-direction:column;gap:8px;min-width:0}
.ba img{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:1/2;border-radius:16px;border:1px solid var(--line);background:var(--shot-bg)}
.ba figcaption{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ba .status{grid-column:1/-1}
.sumup{display:flex;flex-direction:column;gap:16px;min-width:0}
.facts{font-size:17px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.field input{font-weight:400;font-size:15px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;min-width:0}

/* dialog */
dialog{border:0;padding:0;background:transparent;color:var(--ink);width:min(92vw,720px);max-width:92vw;max-height:90vh}
dialog::backdrop{background:var(--scrim)}
.dlg{background:var(--surface);border-radius:24px;padding:clamp(16px,3vw,26px);max-height:90vh;overflow:auto}
.zoom{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:end}
.zoom>div:last-child{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.zoom h3{font-size:24px}
.zoom p{color:var(--muted)}
.zoom .ph{border-radius:26px}
@media (max-width:600px){.zoom{grid-template-columns:minmax(0,1fr)}}
.lg{display:flex;flex-direction:column;gap:18px}
.lg-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lg-n h4{font:600 13px var(--f-body);margin:0 0 4px}
.lg-n ul{font-size:14px;color:var(--muted);padding-left:17px;list-style:disc;overflow-wrap:anywhere}
@media (max-width:600px){.lg-n{grid-template-columns:minmax(0,1fr)}}
.lg .ba{max-width:460px}
</style>
</head>

</div>
<dialog id="dlg" aria-label="Detail"><div class="dlg" id="dlg-in"></div></dialog>

<script>

/* ---------- state ---------- */
const KEY = 'tastetest.v1';
const readLS = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const writeLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

    s.src[idx] = v; root.dataset.src = v;
    $$('.src [data-src]', root).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.src === v)));
    $('.sk', root).hidden = v !== 'sketch'; $('.fg', root).hidden = v !== 'figma';
  };
  const show = () => {
    const has = !!s.fig[idx], im = $('#fg-img', root);
    $('#fg-art', root).dataset.empty = has ? '0' : '1'; im.hidden = !has; if (has) im.src = s.fig[idx]; else im.removeAttribute('src');
    $('[data-act="fig-clear"]', root).hidden = !has;
  };
  async function take(src, revoke) {
    status('Loading…');
    try { s.fig[idx] = await fitImage(src); setSrc('figma'); show(); status(save() ? 'Frame loaded. Paste again to replace it.' : 'Frame loaded, but too large to save along the way. Keep this page open until you finish.'); }
    catch { status('That could not be read as an image. Use a PNG or JPG.'); }
    finally { if (revoke) URL.revokeObjectURL(src); }
  }
  const takeFile = f => { if (!f || !/^image\/(png|jpeg|webp)$/.test(f.type)) { setSrc('figma'); return status('Choose a PNG, JPG or WebP image.'); } take(URL.createObjectURL(f), true); };
  root.addEventListener('click', e => {
    const sb = e.target.closest('.src [data-src]'); if (sb) { setSrc(sb.dataset.src); saveSoon(); return; }
    const ab = e.target.closest('[data-act]'); if (!ab) return;
    if (ab.dataset.act === 'fig-clear') { s.fig[idx] = null; show(); save(); status('Removed.'); }
  });
  $('#fg-file', root).addEventListener('change', e => { takeFile(e.target.files && e.target.files[0]); e.target.value = ''; });
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  root.addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); root.dataset.drop = '1'; } });
  root.addEventListener('dragleave', () => { root.dataset.drop = '0'; });
  root.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); root.dataset.drop = '0'; takeFile(e.dataTransfer.files[0]); });
  setSrc(s.src[idx] === 'figma' ? 'figma' : 'sketch'); show();
  return { takeFile };
}
document.addEventListener('paste', e => { // a frame copied as PNG in Figma lands here
  if (!activeSource || !e.clipboardData) return;
  const it = [...e.clipboardData.items].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (it) { e.preventDefault(); activeSource.takeFile(it.getAsFile()); }
});
document.addEventListener('keydown', e => {
  if (!activeBoard || !(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
  const t = e.target; if (t && (t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !['color', 'checkbox'].includes(t.type)))) return;
  e.preventDefault(); if (e.shiftKey) activeBoard.redo(); else activeBoard.undo();
});

/* ---------- timer ---------- */
let tick = 0, running = false;
const fmt = sec => { const s = Math.ceil(sec); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
function paintTimer() {
  const el = $('#timer'), s = S.session; if (!el || !s || s.step > 3) return;
  const left = s.t[s.step], txt = fmt(left), up = left <= 0;
  if (el.dataset.v !== txt) { el.dataset.v = txt; el.innerHTML = [...txt].map(ch => `<span${ch === ':' ? ' class="c"' : ''}>${ch}</span>`).join(''); }
  el.closest('.round').dataset.up = up ? '1' : '0';
  const b = $('#pause'), m = $('#more');
  if (b) { b.textContent = up ? 'Time is up' : running ? 'Pause' : 'Resume'; b.disabled = up; }
  if (m) m.hidden = !up;
}
function stopTimer() { running = false; clearInterval(tick); tick = 0; save(); paintTimer(); }
function startTimer() {
  const s = S.session; if (running || !s || s.step > 3 || s.t[s.step] <= 0) return paintTimer();
  running = true; let last = Date.now(), n = 0;
  tick = setInterval(() => {
    const cur = S.session; if (!cur || cur.step > 3 || view !== 'round') return stopTimer();
    const now = Date.now(); cur.t[cur.step] = Math.max(0, cur.t[cur.step] - (now - last) / 1000); last = now;
    if (cur.t[cur.step] <= 0) return stopTimer();
    if (++n % 20 === 0) save();
    paintTimer();
  }, 250);
  paintTimer();
}

/* ---------- views ---------- */
function paintTop() {
  const s = S.session, nav = $('#steps'), on = view !== 'home' && !!s;
  nav.hidden = !on;
  nav.innerHTML = on ? ROUNDS.map((r, i) => `<button type="button" data-step="${i}"${i === s.step ? ' aria-current="step"' : ''}${i > s.max ? ' disabled' : ''}><span>${i + 1}</span><b>${r.name}</b></button>`).join('') : '';
  const n = streak();
  $('#streak').textContent = on ? '' : n > 1 ? `${n}-day streak` : n === 1 ? '1-day streak' : '';
}
function logHTML() {
  const n = S.log.length, seen = S.log.reduce((a, l) => a + (l.seen || 0), 0), tot = S.log.reduce((a, l) => a + (l.total || 0), 0);
  const line = n ? `${n} ${n === 1 ? 'session' : 'sessions'} · ${seen} of ${tot} observations spotted on your own` : '';
  return `<div class="sec-h"><h2>Log</h2><p id="log-where">${esc(whereText())}</p></div>
    ${n ? `<p class="status">${line}</p><ul class="log-l">${S.log.slice(0, 40).map(l => `<li><button type="button" data-log="${esc(l.id)}"><time>${esc(niceDate(l.finishedAt))}</time><b>${esc(l.short || l.title)}</b><span>${Number(l.seen) || 0} of ${Number(l.total) || 0} spotted</span><em>${esc(l.takeaway || '')}</em></button></li>`).join('')}</ul>`
      : '<p class="log-empty">No sessions yet. After your first redesign your two versions show up here side by side, with what you spotted and what you missed.</p>'}`;
}
function renderHome() {
  view = 'home'; activeBoard = null; activeSource = null; stopTimer();
  const s = S.session, c = s ? byId(s.cid) : todays(), n = s ? s.n : S.log.length + 1;
  const resume = s ? (s.step > 3 ? 'View your before and after' : `Continue with ${ROUNDS[s.step].name}`) : '';
  V.innerHTML = `<section class="hero">
    <div>
      <span class="eyebrow">One hour a day · four rounds</span>
      <h1>Train your <mark>eye</mark> for design.</h1>
      <p class="lead">AI makes a hundred screens in a minute. You have to see which one is good. You learn that by designing it yourself, looking closely and then doing it again.</p>
    </div>
    <div class="today">
      <span class="eyebrow">${s ? 'In progress' : 'Today’s challenge'} · ${pad(n, 3)}</span>
      <h2>${esc(c.title)}</h2>
      <p>${esc(c.context)}</p>
      <div class="acts">${s
        ? `<button type="button" class="btn" id="go">${resume}</button><button type="button" class="btn quiet" id="drop">Stop this session</button>`
        : '<button type="button" class="btn" id="go">Start the challenge</button><button type="button" class="btn ghost" id="other">Another challenge</button>'}</div>
    </div>
  </section>
  <section class="track" aria-label="The routine">
    <div class="sec-h"><h2>The routine</h2><p>60 minutes, to scale</p></div>
    <div class="ruler" aria-hidden="true"><span style="left:0">0</span><span style="left:33.333%">20</span><span style="left:50%">30</span><span style="left:66.667%">40</span><span style="left:100%">60 min</span></div>
    <ol>${ROUNDS.map((r, i) => `<li style="flex-grow:${r.min}"><span class="k">${pad(i + 1)} · ${r.min} min</span><b>${r.name}</b><p>${r.d}</p></li>`).join('')}</ol>
  </section>
  <section class="log" id="log">${logHTML()}</section>`;
  paintTop();
}
function newSession(c) {
  S.session = { id: 's' + Date.now().toString(36), cid: c.id, n: S.log.length + 1, step: 0, max: 0, t: ROUNDS.map(r => r.min * 60), extra: 0,
    before: [], after: [], src: ['sketch', 'sketch'], fig: [null, null], notes: { p: ['', '', ''], d: ['', '', ''], x: ['', '', ''] }, seen: c.obs.map(() => false), takeaway: '' };
}
function go(step) {
  const s = S.session; if (!s) return renderHome();
  stopTimer();
  if (step === 3 && s.max < 3 && usesFigma(s, 0)) s.src[1] = 'figma'; // keep working where the first version was made
  s.step = step; s.max = Math.max(s.max, step); save();
  if (step > 3) finish(); else { view = 'round'; renderRound(); startTimer(); }
  window.scrollTo(0, 0);
}
const briefHTML = (s, c, sub2) => `<div class="brief"><span class="eyebrow">Your challenge · ${pad(s.n, 3)}</span><h2>${esc(c.title)}</h2><p>${sub2}</p></div>`;
const ownNotes = (s, tag = 'h4') => NOTES.map(g => { const v = s.notes[g.k].filter(x => x.trim()); return `<div><${tag}>${g.own}</${tag}><ul>${v.length ? v.map(x => `<li>${esc(x)}</li>`).join('') : '<li>No notes yet. Add them in Study.</li>'}</ul></div>`; }).join('');
const seenText = (s, c) => `${s.seen.filter(Boolean).length} of ${c.obs.length} spotted`;
const ROUND_BODY = [
  (s, c) => briefHTML(s, c, `${esc(c.context)} No references, no AI. Sketch it here or design it in Figma, the way you think it should be.`) + boardHTML(),
  (s, c) => `<div class="brief"><span class="eyebrow">Your challenge · ${pad(s.n, 3)}</span><h2>${esc(c.intro)}</h2><p>Sketched examples of patterns strong apps use for this. Tap a screen to see it large.</p></div>
    ${refsHTML(c)}
    <div class="notes"><div class="sec-h"><h3>What do you notice?</h3><p>Your observations first. The analysis comes next.</p></div>
      <div class="notes-g">${NOTES.map(g => `<div><h4>${g.label}</h4>${[0, 1, 2].map(i => `<label for="n-${g.k}-${i}"><span>${pad(i + 1)}</span><input id="n-${g.k}-${i}" data-n="${g.k}" data-i="${i}" maxlength="160" autocomplete="off" value="${esc(s.notes[g.k][i])}" placeholder="${g.ph}"></label>`).join('')}</div>`).join('')}</div>
    </div>`,
  (s, c) => `<div class="cmp">
    <div class="obs">
      <div class="brief"><span class="eyebrow">${c.refs.length} reference screens · ${c.obs.length} observations</span><h2>A closer look at ${esc((c.short || 'this screen').toLowerCase())}.</h2></div>
      <details class="again"><summary>Look at the references again</summary>${refsHTML(c)}</details>
      <ol>${c.obs.map((o, i) => `<li class="${s.seen[i] ? 'seen' : ''}"><span class="num">${pad(i + 1)}</span><div><h3><span>${esc(o.t)}</span></h3><p>${esc(o.b)}</p></div><button type="button" class="tick" data-seen="${i}" aria-pressed="${!!s.seen[i]}">${s.seen[i] ? 'Spotted' : 'I spotted this'}</button></li>`).join('')}</ol>
    </div>
    <aside class="eye">
      <h3>Your eye vs. the analysis</h3>
      <p>Tick what you had noticed yourself. Which details will you carry into your redesign?</p>
      ${ownNotes(s)}
      <div class="count"><b id="seen-n">${seenText(s, c)}</b><p>This is not a score. It is about what you can see now and could not an hour ago.</p></div>
    </aside>
  </div>`,
  (s, c) => {
    const missed = c.obs.filter((o, i) => !s.seen[i]), dos = s.notes.d.filter(x => x.trim());
    return briefHTML(s, c, `Same screen, same you. Except you now know ${c.obs.length} more things to look for.`) + `<div class="re">${boardHTML()}
    <aside class="take"><h3>Take with you</h3>
      ${missed.length ? `<p>You missed these the first time:</p><ul>${missed.map(o => `<li>${esc(o.t)}</li>`).join('')}</ul>` : '<p>You had spotted every observation. Check that they are in your design too.</p>'}
      ${dos.length ? `<p>Your do’s:</p><ul>${dos.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${s.src[0] === 'sketch' && s.before.length ? '<button type="button" class="btn ghost" id="copy-first">Start from my first sketch</button>' : ''}
    </aside></div>`;
  },
];
function renderRound() {
  const s = S.session, c = byId(s.cid), r = ROUNDS[s.step];
  activeBoard = null;
  V.innerHTML = `<section class="round" data-step="${s.step}">
    <header class="clock">
      <div class="clock-t" id="timer" role="timer"></div>
      <div class="clock-n"><span class="eyebrow">Round ${s.step + 1} of 4</span><h1>${r.name}</h1></div>
      <div class="clock-c"><button type="button" class="btn ghost" id="more" hidden>+ 5 min</button><button type="button" class="btn ghost" id="pause">Pause</button></div>
    </header>
    ${ROUND_BODY[s.step](s, c)}
    <footer class="next"><p>${r.hint}</p><button type="button" class="btn" id="next">${s.step < 3 ? `On to ${ROUNDS[s.step + 1].name}` : 'Finish'}</button></footer>
  </section>`;
  const bd = $('#board'); activeSource = null;
  if (bd) {
    const idx = s.step === 0 ? 0 : 1;
    activeBoard = mountBoard(bd, shapesOf(s, idx), saveSoon); activeSource = mountSource(bd, s, idx);
  }
  paintTop(); paintTimer();
}
const minsSpent = s => Math.max(1, Math.round((ROUNDS.reduce((a, r, i) => a + r.min * 60 - s.t[i], 0) + (s.extra || 0)) / 60));
function finish() {
  const s = S.session, c = byId(s.cid), i = S.log.findIndex(l => l.id === s.id), old = i >= 0 ? S.log[i] : null;
  const entry = { id: s.id, cid: s.cid, n: s.n, title: c.title, short: c.short || '', day: old ? old.day : dayStr(), finishedAt: old ? old.finishedAt : new Date().toISOString(),
    seen: s.seen.filter(Boolean).length, total: c.obs.length, notes: s.notes, takeaway: s.takeaway || '', mins: minsSpent(s) };
  if (old) S.log[i] = entry; else S.log.unshift(entry);
  save();
  Promise.all([thumbOf(s, 0), thumbOf(s, 1)]).then(([before, after]) => { writeLS(KEY + '.shot.' + s.id, { before, after }); pruneShots(); }).catch(() => {});
  view = 'result'; renderResult();
}
function renderResult() {
  const s = S.session, c = byId(s.cid); activeBoard = null; activeSource = null;
  const notes = NOTES.reduce((a, g) => a + s.notes[g.k].filter(x => x.trim()).length, 0);
  V.innerHTML = `<section class="result">
    <div class="brief"><span class="eyebrow">Challenge ${pad(s.n, 3)} complete</span><h1>Before and after</h1><p>${esc(c.title)}</p></div>
    <div class="res">
      <div class="ba">
        <figure><img alt="Your first version" src="${imgOf(s, 0)}"><figcaption>First version</figcaption></figure>
        <figure><img alt="Your redesign" src="${imgOf(s, 1)}"><figcaption>Redesign</figcaption></figure>
      </div>
      <div class="sumup">
        <p class="facts">${seenText(s, c).replace(' spotted', '')} observations spotted on your own, ${notes} ${notes === 1 ? 'note' : 'notes'}, ${minsSpent(s)} ${minsSpent(s) === 1 ? 'minute' : 'minutes'} of practice.</p>
        <label class="field" for="takeaway">What will you take into tomorrow?<input id="takeaway" maxlength="200" autocomplete="off" value="${esc(s.takeaway)}" placeholder="One sentence is enough"></label>
        <div class="acts"><button type="button" class="btn" id="done">Done for today</button><button type="button" class="btn ghost" id="png">Save before and after as PNG</button></div>
        <p class="status" id="res-status">A new challenge is waiting tomorrow.</p>
      </div>
    </div>
  </section>`;
  paintTop();
}

/* ---------- dialog ---------- */
const D = $('#dlg'), DI = $('#dlg-in');
function openDlg(html) { DI.innerHTML = html; try { D.showModal(); } catch { D.setAttribute('open', ''); } }
D.addEventListener('click', e => { if (e.target === D || e.target.closest('[data-close]')) { try { D.close(); } catch { D.removeAttribute('open'); } } });
const okImg = v => (typeof v === 'string' && v.startsWith('data:image/') ? v : '');
async function openLog(id) {
  const l = S.log.find(x => x.id === id); if (!l) return;
  const groups = NOTES.map(g => { const v = ((l.notes || {})[g.k] || []).filter(x => String(x).trim()); return v.length ? `<div><h4>${g.own}</h4><ul>${v.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''; }).join('');
  openDlg(`<div class="lg"><div class="brief"><span class="eyebrow">${esc(niceDate(l.finishedAt))} · challenge ${pad(Number(l.n) || 0, 3)}</span><h3>${esc(l.title)}</h3><p>${Number(l.seen) || 0} of ${Number(l.total) || 0} observations spotted on your own${l.takeaway ? '. ' + esc(l.takeaway) : ''}</p></div>
    <div class="ba" id="lg-ba"><p class="status">Loading sketches…</p></div>${groups ? `<div class="lg-n">${groups}</div>` : ''}<div><button type="button" class="btn ghost" data-close>Close</button></div></div>`);
  let sh = readLS(KEY + '.shot.' + id);
  const el = $('#lg-ba'); if (!el) return;
  const a = okImg(sh && sh.before), b = okImg(sh && sh.after);
  el.innerHTML = a && b ? `<figure><img alt="First version" src="${esc(a)}"><figcaption>First version</figcaption></figure><figure><img alt="Redesign" src="${esc(b)}"><figcaption>Redesign</figcaption></figure>` : '<p class="status">The sketches from this session were not saved.</p>';
}

/* ---------- logbook storage: this browser ---------- */
const whereText = () => 'Saved in this browser';
function pruneShots() {
  const keep = new Set(S.log.slice(0, 30).map(l => l.id));
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith(KEY + '.shot.') && !keep.has(k.slice(KEY.length + 6))) localStorage.removeItem(k); } } catch {}
}

/* ---------- saving files ---------- */
function saveFile(name, blob) {
  const a = document.createElement('a'), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function comparePNG(s, c) {
  const layers = await Promise.all([layerOf(s, 0), layerOf(s, 1)]);
  const P = 48, G = 40, W = P * 2 + AW * 2 + G, H = 150 + AH + P, cv = document.createElement('canvas'); cv.width = W * 2; cv.height = H * 2;
  const x = cv.getContext('2d'); x.scale(2, 2); x.fillStyle = '#f1f1f5'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#16161d'; x.textBaseline = 'top'; x.font = '600 26px "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif';
  let line = '', y = P - 8; const words = String(c.title).split(' ');
  for (const w of words) { if (x.measureText(line + w).width > W - P * 2 && line) { x.fillText(line.trim(), P, y); y += 32; line = ''; } line += w + ' '; }
  x.fillText(line.trim(), P, y);
  x.font = '500 12px "DM Mono", ui-monospace, monospace'; x.fillStyle = '#5f5f6d';
  ['FIRST VERSION', 'REDESIGN'].forEach((label, i) => {
    const ox = P + i * (AW + G); x.fillStyle = '#5f5f6d'; x.fillText(label, ox, 118); x.drawImage(layers[i], ox, 140, AW, AH); x.strokeStyle = '#dadae4'; x.lineWidth = 1; x.strokeRect(ox + .5, 140.5, AW - 1, AH - 1);
  });
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

/* ---------- events ---------- */
$('#home').addEventListener('click', renderHome);
$('#steps').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b && !b.disabled && S.session) go(Number(b.dataset.step)); });
let dropT = 0;
V.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.closest('.tools, .src, .fg')) return;
  const s = S.session, c = s && byId(s.cid);
  if (t.id === 'go') { if (!s) { newSession(todays()); go(0); } else go(s.step); }
  else if (t.id === 'other') { const list = allCh(), i = list.indexOf(todays()); S.pick = { id: list[(i + 1) % list.length].id, day: dayStr() }; save(); renderHome(); }
  else if (t.id === 'drop') {
    if (t.dataset.sure) { clearTimeout(dropT); S.session = null; save(); renderHome(); }
    else { t.dataset.sure = '1'; t.textContent = 'Are you sure? Your sketches will be lost'; dropT = setTimeout(() => { if (t.isConnected) { delete t.dataset.sure; t.textContent = 'Stop this session'; } }, 4000); }
  }
  else if (t.dataset.log) openLog(t.dataset.log);
  else if (!s) return;
  else if (t.id === 'pause') { if (running) stopTimer(); else startTimer(); }
  else if (t.id === 'more') { s.t[s.step] = 300; s.extra = (s.extra || 0) + 300; startTimer(); }
  else if (t.id === 'next') go(s.step + 1);
  else if (t.dataset.ref) { const r = c.refs[Number(t.dataset.ref)]; if (r) openDlg(`<div class="zoom">${phone(r)}<div><h3>${esc(r.name)}</h3><p>${esc(r.caption)}</p><button type="button" class="btn ghost" data-close>Close</button></div></div>`); }
  else if (t.dataset.seen) {
    const i = Number(t.dataset.seen); s.seen[i] = !s.seen[i]; save();
    t.setAttribute('aria-pressed', String(s.seen[i])); t.textContent = s.seen[i] ? 'Spotted' : 'I spotted this'; t.closest('li').classList.toggle('seen', s.seen[i]);
    $('#seen-n').textContent = seenText(s, c);
  }
  else if (t.id === 'copy-first') { if (activeBoard) activeBoard.replace(s.before); }
  else if (t.id === 'done') { S.session = null; save(); renderHome(); window.scrollTo(0, 0); }
  else if (t.id === 'png') comparePNG(s, c).then(b => b && saveFile('tastetest-before-and-after.png', b)).catch(() => {});
});
V.addEventListener('input', e => {
  const t = e.target, s = S.session; if (!s) return;
  if (t.dataset.n) { s.notes[t.dataset.n][Number(t.dataset.i)] = t.value; saveSoon(); }
  else if (t.id === 'takeaway') { s.takeaway = t.value; saveSoon(); }
});
V.addEventListener('change', e => {
  const s = S.session; if (e.target.id !== 'takeaway' || !s) return;
  const l = S.log.find(x => x.id === s.id); if (l) { l.takeaway = s.takeaway; save(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

renderHome();
})();
